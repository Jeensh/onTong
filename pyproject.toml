[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ontong"
version = "0.1.0"
description = "onTong - Knowledge-Fused Multi-Agent Platform (Agentic OS) for SCM"
authors = [{name = "onTong Team"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0"
]

[tool.poetry]
package-mode = false

[tool.poetry.scripts]
ontong = "backend.cli.__main__:main"

[tool.poetry.dependencies]
python = "^3.10"

# Core Framework
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
python-multipart = ">=0.0.6"

# LLM & AI
litellm = "^1.0"
langfuse = "^2.0"
openai = "^1.0"
pydantic-ai-slim = {version = "^1.75", extras = ["litellm"]}

# Vector Database
chromadb = "^0.4.0"

# Search
rank-bm25 = "^0.2.2"
elasticsearch = "^8.0"

# Graph Database (Section 2 - Modeling)
neo4j = "^5.0"

# Graph Algorithms (Section 3 - Simulation ontology traversal)
networkx = "^3.2"

# Code Analysis (Section 2 - Modeling)
tree-sitter = "^0.23"

# Persistence (Modeling P13 2026-04-26 + Phase 0 rename/concurrency 2026-05)
# Both sections converged on sqlalchemy + alembic; Phase 0 picks the higher pin.
sqlalchemy = "^2.0"
alembic = "^1.13"
asyncpg = "^0.29"
tree-sitter-java = "^0.23"
sqlglot = "^23.0"
# javalang = "^0.13.0"  # Java parsing (deprecated)

# Cache / Locking
redis = "^5.0"

# Task Queue
arq = "^0.26"

# Utilities
httpx = "^0.25.0"
aiofiles = "^23.0"
pyyaml = "^6.0"
python-dateutil = "^2.8"
python-ulid = "^2.0"

# Image Analysis (OCR)
easyocr = "^1.7"
ollama = ">=0.4"

# Manual Ingest (Section 2 Modeling Round 3 — OD-11-D2)
pypdf = "^5.0"
pdfplumber = "^0.11"
python-docx = "^1.2"
python-pptx = "^1.0"

# Observability
python-json-logger = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21.0"
black = "^23.0"
ruff = "^0.1.0"
mypy = "^1.0"
httpx = "^0.25.0"
fakeredis = "^2.20"
pytest-postgresql = "^6.0"
locust = "^2.20"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
markers = [
    "integration: marks tests that hit external services (real LLM, network). Gated by env vars — see individual tests.",
]
