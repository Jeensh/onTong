# slab-design — H2 in-memory 프로파일
# 사용법:
#   java -jar slab-design-boot-1.0.0-SNAPSHOT.jar --spring.profiles.active=h2
# 또는:
#   ./mvnw -pl slab-design-boot spring-boot:run -Dspring-boot.run.profiles=h2
#
# H2 in-memory DB + Hibernate ddl-auto=create-drop → 기동 시 schema 자동 생성.
# data.sql 은 Hibernate 가 schema 만든 직후 자동 실행.

spring:
  datasource:
    url: jdbc:h2:mem:slabdesign;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 5000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Hibernate 가 @Entity / @Table / @Column 메타데이터로 schema 자동 생성
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.highlight_sql: false
    open-in-view: false
    defer-datasource-initialization: true   # data.sql 을 ddl 이후 실행

  sql:
    init:
      mode: always
      data-locations: classpath:data-h2.sql
      continue-on-error: false

  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092

  # H2 web 콘솔 (선택) — http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.example.slabdesign: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: INFO
