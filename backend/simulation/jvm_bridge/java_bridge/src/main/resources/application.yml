spring:
  main:
    web-application-type: none       # CLI — 웹 서버 미기동
    banner-mode: off
  jpa:
    open-in-view: false
  kafka:
    enabled: false                   # auto-configuration 도 exclude 됐지만 안전벨트
  datasource:
    # H2 in-memory — Oracle 의존성 회피. mock Repository 면 사실 미사용.
    url: jdbc:h2:mem:bridge;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

logging:
  level:
    root: WARN
    com.ontong: INFO
    com.example.slabdesign: WARN
  pattern:
    console: "%-5level [%logger{0}] %msg%n"
